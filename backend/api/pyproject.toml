[project]
name = "documind-api"
version = "0.10.0"
description = "DocuMind AI — production-grade RAG document Q&A platform"
requires-python = ">=3.14,<3.15"
# Direct dependencies only — things this codebase imports, or that are required at
# runtime without being imported. Transitive dependencies are resolved by uv and
# pinned in uv.lock, which is the file that makes builds reproducible. Listing
# transitives here (as the original pip-freeze migration did) makes every
# transitive advisory a manual edit and produces unsatisfiable sets for Dependabot.
dependencies = [
    "alembic>=1.18.5",
    # Not imported: SQLAlchemy loads it from the postgresql+asyncpg:// URL.
    "asyncpg>=0.31.0",
    "aws-embedded-metrics>=3.5.0",
    "boto3>=1.43.56",
    "botocore>=1.43.82",
    "cryptography>=50.0.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "pgvector>=0.5.0",
    "pybreaker>=1.4.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.15.0",
    "pysbd>=0.3.4",
    # Not imported directly: pydantic-settings reads .env through it.
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    # The asyncio extra pulls greenlet, which SQLAlchemy's async support requires
    # at runtime without it ever being imported here.
    "sqlalchemy[asyncio]>=2.0.51",
    "starlette>=1.6.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    # Not imported directly — constrains the version resolved transitively, which
    # was previously pulled at a release with an open security advisory.
    "urllib3>=2.8.0",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests hit real AWS (cost + credentials + flakiness), so they are
# excluded from the default run and from CI. Run them deliberately with:
#   uv run pytest -m integration
# --import-mode=importlib lets test files share a basename across directories
# (e.g. generation/test_service.py and retrieval/test_service.py) without
# needing __init__.py in every test package.
addopts = "-v -m 'not integration' --import-mode=importlib"
markers = [
    "integration: touches real external services (AWS); excluded by default",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pre-commit>=4.6.2",
    # Used only by infra/scripts/sync_env.py, a local development tool. Kept out
    # of [project.dependencies] deliberately: the application talks to Postgres
    # through asyncpg, so this driver would otherwise ship in the API and worker
    # images for nothing.
    "psycopg[binary]>=3.3.4",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "ruff==0.16.4",
    # Not imported directly — constrains the version pre-commit resolves,
    # which was pinned to a release with open security advisories.
    "virtualenv>=21.7.13",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (real bugs: unused imports/vars, undefined names)
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (likely bugs)
    "UP",   # pyupgrade (modernize syntax for your Python version)
    "C4",   # flake8-comprehensions
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"app/generation/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
files = ["app", "tests", "benchmark"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
check_untyped_defs = true

plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
