[project]
name = "documind-api"
version = "0.7.0"
description = "DocuMind AI — production-grade RAG document Q&A platform"
requires-python = ">=3.14"
dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "aiosignal==1.4.0",
    "alembic==1.18.5",
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.14.2",
    "asyncpg==0.31.0",
    "attrs==26.1.0",
    "aws-embedded-metrics==3.5.0",
    "boto3==1.43.56",
    "botocore==1.43.56",
    "certifi==2026.6.17",
    "cffi==2.1.0",
    "charset-normalizer==3.4.9",
    "click==8.4.2",
    "colorama==0.4.6",
    "cryptography>=50.0.0",
    "fastapi==0.139.2",
    "frozenlist==1.8.0",
    "greenlet==3.5.3",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.18",
    "jmespath==1.1.0",
    "mako==1.3.12",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.3",
    "mdurl==0.1.2",
    "multidict==6.7.1",
    "packaging==26.2",
    "pgvector==0.5.0",
    "propcache==0.5.2",
    "psycopg==3.3.4",
    "psycopg-binary==3.3.4",
    "pyasn1==0.6.4",
    "pybreaker==1.4.1",
    "pycparser==3.0",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pydantic-settings==2.14.2",
    "pygments==2.20.0",
    "pyjwt==2.13.0",
    "pysbd==0.3.4",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "regex==2026.7.19",
    "requests==2.34.2",
    "rsa==4.9.1",
    "s3transfer==0.19.2",
    "six==1.17.0",
    "sqlalchemy==2.0.51",
    "starlette==1.6.0",
    "structlog==26.1.0",
    "tenacity==9.1.4",
    "tiktoken==0.13.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.2",
    "tzdata==2026.3",
    "urllib3==2.7.0",
    "uvicorn==0.51.0",
    "yarl==1.24.5",
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "ruff==0.16.4",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (real bugs: unused imports/vars, undefined names)
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (likely bugs)
    "UP",   # pyupgrade (modernize syntax for your Python version)
    "C4",   # flake8-comprehensions
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.14"
files = ["app", "tests"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
check_untyped_defs = true

plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
